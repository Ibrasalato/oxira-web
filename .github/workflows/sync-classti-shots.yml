# One-off helper: copies the current product screenshots from classti.com into
# public/products/classti/ (the build sandbox can't reach classti.com).
# Runs when this file or the URL list changes, or manually.
name: Sync Classti screenshots
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-classti-shots.yml', 'scripts/classti-shots.txt']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p public/products/classti
          while read -r name url; do
            [ -z "$name" ] && continue
            curl -fsSL --retry 3 -o "public/products/classti/$name" "$url"
          done < scripts/classti-shots.txt
          ls -la public/products/classti
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/products/classti
          git diff --cached --quiet || git commit -m "Sync Classti screenshots from classti.com"
          git push
